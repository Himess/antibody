[package]
name = "antibody-practice-account"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A practice account's own contract: it passes the practice key's calls on to near-antibody, and closes the account, its NEAR back to the vending contract that created it"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
resolver = "3"
