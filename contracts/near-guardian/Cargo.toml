[package]
name = "antibody-guardian"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Antibody guardian v2: EIP-712 pause and release permits signed with Chain Signatures under each program's own path"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.9.0", features = ["unstable"] }
hex = "0.4"
bs58 = "0.5"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[profile.release]
strip = true
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
resolver = "3"

[patch.crates-io]
# Test-only: near-sdk's `unit-testing` feature pulls near-vm-runner, whose filesystem cache is Unix-only.
near-vm-runner = { path = "../../third_party/patches/near-vm-runner-0.29.2" }
