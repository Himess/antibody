[package]
name = "near-antibody"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Antibody settlement contract v2: the NEAR adapter of the rule core (antibody-rules)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.9.0", features = ["unstable"] }
antibody-rules = { path = "../../crates/rules" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unstable", "unit-testing"] }

[workspace]
resolver = "3"
members = [".", "tusd", "mock-outlayer", "mock-mpc", "mock-dcap"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
strip = true
overflow-checks = true

[patch.crates-io]
# Test-only: near-sdk's `unit-testing` feature pulls near-vm-runner, whose filesystem cache is Unix-only.
near-vm-runner = { path = "../../third_party/patches/near-vm-runner-0.29.2" }
