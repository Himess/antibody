[package]
name = "antibody-tusd"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "tUSD: a NEP-141 testnet token with no value, used for Antibody escrow, bonds and payouts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.9.0", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unstable", "unit-testing"] }
