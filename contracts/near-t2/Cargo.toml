[package]
name = "near-t2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "T2: validity proofs of disclosed verdicts. An SP1 6.10.0 Groth16 proof checked with NEAR's alt_bn128 host functions, then compared with near-antibody's records of the run (docs/zk.md)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.9.0" }

[dev-dependencies]
near-sdk = { version = "=5.9.0", features = ["unit-testing"] }
hex = "0.4"
serde_json = "1"

[profile.release]
strip = true
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
resolver = "3"

[patch.crates-io]
# Test-only: near-sdk's `unit-testing` feature pulls near-vm-runner, whose filesystem cache is Unix-only.
near-vm-runner = { path = "../../third_party/patches/near-vm-runner-0.29.2" }
