[workspace]
members = ["crates/verifier", "crates/witness", "crates/runner"]
exclude = ["third_party", "contracts"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# rsp, pinned to an exact commit
rsp-client-executor = { git = "https://github.com/succinctlabs/rsp", rev = "5afe72eb12a2d6accd9d7fdff66785d91cbc8e72" }
rsp-mpt = { git = "https://github.com/succinctlabs/rsp", rev = "5afe72eb12a2d6accd9d7fdff66785d91cbc8e72" }
rsp-primitives = { git = "https://github.com/succinctlabs/rsp", rev = "5afe72eb12a2d6accd9d7fdff66785d91cbc8e72" }
rsp-rpc-db = { git = "https://github.com/succinctlabs/rsp", rev = "5afe72eb12a2d6accd9d7fdff66785d91cbc8e72" }

# reth (same tag as rsp)
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false, features = ["serde"] }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", default-features = false }
reth-primitives-traits = { version = "0.3.2", default-features = false }

# revm (same as rsp)
revm = { version = "38.0.0", features = ["serde", "bn"], default-features = false }
revm-primitives = { version = "23.0.0", features = ["serde"], default-features = false }

# alloy (same as rsp)
alloy-evm = { version = "0.34.0", default-features = false }
alloy-primitives = { version = "1.5.6", default-features = false, features = ["map-foldhash"] }
alloy-consensus = { version = "2.0.4", default-features = false, features = ["serde", "serde-bincode-compat"] }
alloy-eips = { version = "2.0.4", default-features = false }
alloy-rlp = "0.3.12"
alloy-trie = "0.9.3"
alloy-provider = { version = "2.0.4", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-rpc-types = { version = "2.0.4", default-features = false, features = ["eth"] }
alloy-network = { version = "2.0.4", default-features = false }

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0.94"
bincode = "1.3.3"
sha2 = "0.10.9"
hex = "0.4"
tokio = { version = "1.21", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
incremental = false

[patch.crates-io]
# Windows-only build fix (see third_party/patches/kzg-rs-0.2.9/build.rs); logic unchanged.
kzg-rs = { path = "third_party/patches/kzg-rs-0.2.9" }
