# gitleaks configuration (used by .githooks/pre-commit and CI).
title = "antibody"

[extend]
useDefault = true

[allowlist]
description = "Generated proof data and public test fixtures"
paths = [
  # Binary state-proof witnesses (Merkle nodes, hashes): high entropy by construction, no secrets.
  '''fixtures/.*\.witness\.bin$''',
  # SP1's published Groth16 verifying key and fixture proof, near-antibody's public testnet records
  # (public program vkey hashes, proofs and hashes).
  '''contracts/near-t2/tests/data/.*''',
  # The same files under their G0 spike path (history: CI scans every commit).
  '''contracts/sp1-groth16-spike/tests/data/.*''',
  # T2 fixtures: the TEST Groth16 key, and the proofs of disclosed runs with their network request ids.
  '''fixtures/zk/t2-test-key\.json$''',
  '''fixtures/zk/[^/]+/proof\.json$''',
  # Web vectors: practice content keys are public by construction (sha256 of a published formula,
  # docs/zk.md), and the seeds, salts and nonces are fixed test bytes (0x21…, 0x41…).
  '''golden/web-vectors\.json$''',
  # The web app's test fixtures: snapshots of the public testnet API (hashes, tags, public keys) and the
  # near-t2 test scenario built from them (public program vkey, placeholder hashes).
  '''web/tests/fixtures/.*\.json$''',
]
