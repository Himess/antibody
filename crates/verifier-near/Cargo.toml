[package]
name = "antibody-verifier-near"
description = "Verifier v2's NEAR engine: NEAR contracts (wasm) executed deterministically under wasmi, with NEAR's host functions, receipts and fee schedule"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The interpreter, pinned exactly (docs/near-targets.md §3). No `wat`, no memory64, no SIMD; btree collections
# inside the interpreter, so nothing in it needs a random source.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "prefer-btree-collections"] }
# The same parser wasmi 2.0.0 uses: module checks and the float rewrite (src/prepare.rs).
wasmparser = { version = "=0.228.0", default-features = false, features = ["std", "validate", "features"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64 = "0.22"
# NEAR's math host functions. Versions already in Cargo.lock.
sha3 = { version = "0.11", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
# ed25519 verification on the curve arithmetic v1 already links (no feature v1 does not use).
curve25519-dalek = { version = "4.1.3", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "arithmetic"] }

[dev-dependencies]
# WAT test modules (the version already in Cargo.lock).
wat = "=1.263.0"
