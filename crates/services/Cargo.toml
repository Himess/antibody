[package]
name = "antibody-services"
description = "Antibody backend: indexer, API, relayer, notifier, sandbox mocks and the offline end-to-end demo"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "antibody-services"
path = "src/main.rs"

[dependencies]
antibody-cli = { path = "../cli" }
antibody-verifier = { path = "../verifier" }
antibody-rules = { path = "../rules" }
alloy-primitives.workspace = true
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
base64 = "0.22"
eyre = "0.6.12"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "blocking"] }
k256 = { version = "0.13", features = ["ecdsa"] }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
