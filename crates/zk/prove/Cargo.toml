[package]
name = "antibody-zk-prove"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Proves disclosed verification runs (crates/zk/guest) with SP1 6.10.0: Groth16 proofs from SP1's prover network, or a local CUDA machine"

[[bin]]
name = "antibody-zk-prove"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "=6.10.0", features = ["network"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
anyhow = "1"

[features]
# A local NVIDIA GPU (CUDA 12, Linux): `--mode cuda`.
cuda = ["sp1-sdk/cuda"]

[profile.release]
# A client: it sets the program up, simulates it and talks to the network. No proving happens here
# unless `cuda` is on.
codegen-units = 16
lto = false
debug = false

# Its own workspace: SP1's crates stay out of the root lockfile (the verifier the programs pin).
[workspace]
resolver = "2"
