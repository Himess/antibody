[package]
name = "antibody-zk-host"
description = "Runs the SP1 program on a disclosed run in SP1's executor (no proof): cycles, public values, and the receipt against the TEE's"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "antibody-zk"
path = "src/main.rs"

# No verifier here: the host only feeds the program and reads its public values (layout v1,
# antibody-zk-core), so SP1's executor builds without the verifier's tree.
[dependencies]
sp1-core-executor = "=6.10.0"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

# Its own workspace: SP1's executor stays out of the root workspace's lockfile.
[workspace]

[profile.release]
opt-level = 3
debug = false
