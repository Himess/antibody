[package]
name = "antibody-cli"
description = "antibody: create programs, hunt, commit and submit sealed proofs, verify receipts, MCP server for agents"
# The CLI is released on its own (v0.6.2); the verifier keeps the workspace version its pinned build has.
version = "0.6.2"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "antibody"
path = "src/main.rs"

[dependencies]
antibody-rules = { path = "../rules" }
antibody-verifier = { path = "../verifier" }
antibody-witness = { path = "../witness" }
antibody-zk-core = { path = "../zk/core" }
alloy-primitives.workspace = true
# `antibody immune` runs a build's creation code (with the verifier's EVM) and reads its mapping file (TOML)
revm.workspace = true
toml = "0.8.23"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "blocking"] }
eyre = "0.6.12"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
bs58 = "0.5"
base64 = "0.22"
getrandom = "0.2"

[dev-dependencies]
# tests/web_vectors.rs reads the practice base's anchor header (both are already in the lockfile)
alloy-consensus.workspace = true
alloy-rlp.workspace = true

# A UTF-8 console on Windows (program names carry "—"); the version is already in Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
