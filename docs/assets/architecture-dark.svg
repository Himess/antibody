<path d="M 620 580 L 150 580 L 150 694" fill="none" stroke="#ff3f98" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="385" y="573" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="middle">the signed permits, relayed to every chain</text>
