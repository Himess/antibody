<text x="422" y="142" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="start">commit, reveal</text>
<path d="M 520 200 L 520 88" fill="none" stroke="#ff3f98" stroke-width="1.8" marker-end="url(#head-accent)"/>
