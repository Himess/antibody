<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 812" width="1000" height="812" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Antibody architecture: a project commits rules, payouts and an escrow to near-antibody on NEAR testnet; a hunter or AI agent commits and reveals a sealed proof with a bond; near-antibody asks OutLayer to run the pinned verifier in an Intel TDX enclave, which returns the verdict and its TDX quote, verified on NEAR; near-antibody pays the bounty in wNEAR; a critical verdict in the pause policy has near-guardian and the MPC network sign pause permits, relayed to the AntibodyAdapter that pauses Acme Lend on Sepolia and Base Sepolia."><title>How Antibody works: the contracts, the enclave and the chains</title><defs><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff3f98"/></marker><marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker></defs>
<rect x="40" y="24" width="240" height="64" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="160.0" y="53.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Project</text>
<text x="160.0" y="71.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">commits its rules before a launch</text>
<rect x="380" y="24" width="240" height="64" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="500.0" y="53.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Hunter or AI agent</text>
<text x="500.0" y="71.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">CLI or MCP</text>
<path d="M 712 42 L 760 42" fill="none" stroke="#ff3f98" stroke-width="1.8" marker-end="url(#head-accent)"/>
<text x="772" y="46" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="start">steps 1 to 5 of How it works</text>
<path d="M 712 66 L 760 66" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head-line)"/>
<text x="772" y="70" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="start">a read or a check</text>
<text x="712" y="94" font-size="11.5" font-weight="normal" fill="#9198a1" text-anchor="start">Keepers and relayers carry the quote, the</text>
<text x="712" y="109" font-size="11.5" font-weight="normal" fill="#9198a1" text-anchor="start">payout call and the permits: anyone can run one.</text>
<rect x="20" y="150" width="690" height="395" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="40" y="176" font-size="14" font-weight="600" fill="#e6edf3">NEAR testnet<tspan font-size="12.5" font-weight="normal" fill="#9198a1" dx="8">every contract locked</tspan></text>
<rect x="290" y="200" width="240" height="90" rx="8" fill="#2a0f1c" stroke="#ff3f98" stroke-width="1.5"/>
<text x="410.0" y="235.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">near-antibody</text>
<text x="410.0" y="253.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">programs, escrow,</text>
<text x="410.0" y="269.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">verdicts, payouts</text>
<rect x="40" y="200" width="200" height="52" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="140.0" y="222.75" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Ethereum light client</text>
<text x="140.0" y="241.0" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">confirms the anchor block</text>
<rect x="40" y="264" width="200" height="52" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="140.0" y="286.75" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Intel TDX quote verifier</text>
<text x="140.0" y="305.0" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">checks the run's quote: T1</text>
<rect x="40" y="360" width="210" height="56" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="145.0" y="385.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">near-t2</text>
<text x="145.0" y="403.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">verifies SP1 proofs: T2</text>
<rect x="300" y="360" width="200" height="56" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="400.0" y="385.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Verdict guard</text>
<text x="400.0" y="403.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">a NEAR app acting on verdicts</text>
<rect x="540" y="360" width="160" height="56" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="620.0" y="385.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">near-guardian</text>
<text x="620.0" y="403.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">pause permits</text>
<rect x="540" y="470" width="160" height="46" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="620.0" y="489.75" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">MPC network</text>
<text x="620.0" y="508.0" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">signs for other chains</text>
<rect x="740" y="150" width="240" height="250" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="760" y="176" font-size="14" font-weight="600" fill="#e6edf3">OutLayer</text>
<rect x="755" y="192" width="210" height="188" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="860.0" y="234.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Verifier in an</text>
<text x="860.0" y="252.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Intel TDX enclave</text>
<text x="860.0" y="270.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">opens the sealed proof,</text>
<text x="860.0" y="286.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">checks its state against</text>
<text x="860.0" y="302.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">the anchor block, re-runs</text>
<text x="860.0" y="318.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">the calls, and reports the</text>
<text x="860.0" y="334.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">rule broken, the entry</text>
<text x="860.0" y="350.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">point and the impact</text>
<rect x="20" y="610" width="960" height="185" rx="12" fill="#151b23" stroke="#3d444d"/>
<text x="40" y="636" font-size="14" font-weight="600" fill="#e6edf3">The protocol's chains<tspan font-size="12.5" font-weight="normal" fill="#9198a1" dx="8">Ethereum testnets</tspan></text>
<rect x="40" y="650" width="450" height="128" rx="10" fill="none" stroke="#3d444d"/>
<text x="476" y="672" font-size="13" font-weight="600" fill="#9198a1" text-anchor="end">Sepolia</text>
