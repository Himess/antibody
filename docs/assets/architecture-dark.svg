<text x="532" y="141" font-size="11.5" font-weight="normal" fill="#9198a1" text-anchor="start">else after its window</text>
<path d="M 530 212 L 755 212" fill="none" stroke="#ff3f98" stroke-width="1.8" marker-end="url(#head-accent)"/>
<circle cx="552" cy="212" r="9" fill="#ff3f98"/><text x="552" y="216" font-size="11.5" font-weight="700" fill="#0a0b0c" text-anchor="middle">3</text>
<text x="568" y="205" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="start">run request, pinned verifier</text>
