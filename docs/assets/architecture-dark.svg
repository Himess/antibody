<path d="M 160 88 L 160 110 L 320 110 L 320 200" fill="none" stroke="#ff3f98" stroke-width="1.8" marker-end="url(#head-accent)"/>
<circle cx="240" cy="110" r="9" fill="#ff3f98"/><text x="240" y="114" font-size="11.5" font-weight="700" fill="#0a0b0c" text-anchor="middle">1</text>
<text x="170" y="128" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="start">rules as code,</text>
<text x="170" y="143" font-size="12" font-weight="normal" fill="#e6edf3" text-anchor="start">payouts and escrow</text>
<path d="M 410 88 L 410 200" fill="none" stroke="#ff3f98" stroke-width="1.8" marker-end="url(#head-accent)"/>
<circle cx="410" cy="118" r="9" fill="#ff3f98"/><text x="410" y="122" font-size="11.5" font-weight="700" fill="#0a0b0c" text-anchor="middle">2</text>
