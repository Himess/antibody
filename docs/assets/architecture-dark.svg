<text x="150.0" y="740.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">accepts signed permits</text>
<rect x="300" y="694" width="170" height="62" rx="8" fill="#0d1117" stroke="#656c76"/>
<text x="385.0" y="722.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Acme Lend</text>
<text x="385.0" y="740.25" font-size="12.5" font-weight="normal" fill="#9198a1" text-anchor="middle">our test protocol</text>
