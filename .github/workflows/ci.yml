name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks v8.30.1 (checksum-verified release binary)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml -v .
      - name: never-public paths are not tracked
        run: |
          if git ls-files | grep -E '^(\.secrets/|research/|report/|reports/|measurements/|arena-private/|witnesses/|(.*/)?brief[^/]*\.md$|(.*/)?[^/]*_brief[^/]*\.md$|daily/|scripts/report_to_html\.py$|\.env$)'; then
            echo "never-public path is tracked"; exit 1
          fi

  web:
    name: web app (lint, types, the browser try's crypto against the Rust vectors, build, smoke tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: the try's envelope, seal, commitment and NEAR transactions equal golden/web-vectors.json
        run: npm test
      - name: build (against the mock API, the recorded testnet snapshots)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:4010
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      - run: npx playwright install --with-deps chromium
      - name: every page, light, dark and mobile
        run: npx playwright test
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  formal:
    name: settlement model (Quint, Apalache) and trace replay against the rule core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: quint 0.33.1
        run: npm i -g @informalsystems/quint@0.33.1
      # quint downloads its Rust evaluator and Apalache from GitHub releases on first use; kept between
      # runs so an API rate limit cannot fail the job.
      - uses: actions/cache@v4
        with:
          path: ~/.quint
          key: ${{ runner.os }}-quint-0.33.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: rule core tests (scenarios mirroring the model)
        run: cargo test --release -p antibody-rules
      - name: model scenarios, 20,000 random traces, 600 traces of 60 steps replayed against the rule core
        run: scripts/formal/replay.sh 600 60
      # A divergence between the model and the rule core is rare and random: its traces and seed are kept.
      - name: keep the traces of a replay that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quint-traces
          path: target/quint-traces
          retention-days: 14
      - name: bounded model checking (Apalache)
        working-directory: formal
        run: quint verify antibody.qnt --invariant=all_properties --max-steps=6

  kani:
    name: arithmetic of the rule core (Kani proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: '0.68.0'
          args: -p antibody-rules -j 2 --output-format=terse

  evm:
    name: fixture contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: forge --version
      - run: forge test -vv

  verifier:
    name: verifier (native + wasm, recorded fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: unit and integration tests (verifier, TEE mode on the fixture, CLI, services)
        run: cargo test --release -p antibody-verifier -p antibody-cli -p antibody-services -p antibody-zk-core
      - name: build (native)
        run: cargo build --release -p antibody-verifier -p antibody-witness -p antibody-runner
      - name: build (wasm32-wasip2)
        run: cargo build --release --target wasm32-wasip2 -p antibody-verifier --bin antibody-verify
      - name: the verifier wasm as programs pin it (reproducible build; compare its sha256 across machines)
        run: bash scripts/build/verifier-wasm.sh
      - name: recorded fixtures — expected verdicts and keys, native == wasm
        run: |
          python3 scripts/demo/check_fixtures.py fixtures/acme-local
          python3 scripts/demo/check_fixtures.py fixtures/acme-local/round1
      - name: self-attack regressions (inputs that once broke the verifier)
        run: python3 scripts/demo/check_regressions.py

  near:
    name: NEAR contracts (unit tests + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain 1.85.0 (wasm32-unknown-unknown)
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/near-guardian
            contracts/near-antibody
            contracts/practice-account
            contracts/practice-vending
            contracts/verdict-guard
      - name: near-guardian
        working-directory: contracts/near-guardian
        run: |
          cargo test --lib
          cargo build --release --target wasm32-unknown-unknown
      - name: practice account (the code each vended account runs)
        working-directory: contracts/practice-account
        run: cargo build --release --target wasm32-unknown-unknown
      - name: practice vending
        working-directory: contracts/practice-vending
        run: |
          cargo test --lib
          cargo build --release --target wasm32-unknown-unknown
      - name: verdict guard (a NEAR app consuming verdicts)
        working-directory: contracts/verdict-guard
        run: |
          cargo test --lib
          cargo build --release --target wasm32-unknown-unknown
      - name: near-t2 (T2, validity proofs of disclosed verdicts; SP1 6.10.0 Groth16 on NEAR's alt_bn128 host functions)
        working-directory: contracts/near-t2
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/contracts/verdict-guard/target
        run: |
          cargo test --lib -- --nocapture
          cargo build --release --target wasm32-unknown-unknown
      - name: near-antibody (the rule core's NEAR adapter) + tUSD + sandbox mocks
        working-directory: contracts/near-antibody
        run: |
          cargo test --lib -p near-antibody -p antibody-tusd
          cargo build --release --target wasm32-unknown-unknown -p near-antibody -p antibody-tusd -p antibody-mock-outlayer -p antibody-mock-mpc -p antibody-mock-dcap -p antibody-mock-lc

  e2e:
    name: sandbox end-to-end (near-sandbox + anvil, MOCK OutLayer/DCAP)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: toolchains
        run: |
          rustup toolchain install && rustup show
          rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            contracts/near-antibody
            contracts/near-guardian
      - name: build contracts, verifier (native + wasm), CLI and services
        run: make build
      - name: near-sandbox binary (cached; sha256-pinned in scripts/demo/get-sandbox.sh)
        uses: actions/cache@v4
        with:
          path: .tools/near-sandbox
          key: near-sandbox-2.14.0-${{ runner.os }}-${{ hashFiles('scripts/demo/get-sandbox.sh') }}
      - name: sandbox demo
        run: make e2e
      - name: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-demo
          path: |
            target/demo/results.json
            target/demo/*.log
          if-no-files-found: warn
