name: release

# Prebuilt binaries, the verifier build OutLayer runs, and a CLI image, so trying Antibody needs no
# build (JUDGES.md). Runs on a version tag: when it is pushed, or by hand on the tag itself
# (`gh workflow run release.yml --ref <tag>`). Each build provenance attestation names the run's ref and
# commit as the source, so the run must be the tag's. The release it makes is a DRAFT: a maintainer
# reviews and publishes it.
#
# Third-party actions are pinned to full commit SHAs (the version in a comment): a moved tag must not
# change what runs with these jobs' write tokens.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  tag:
    name: the run is a version tag's
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "release ${GITHUB_REF_NAME} from ${GITHUB_SHA}" ;;
            *) echo "::error::run this workflow on a version tag (gh workflow run release.yml --ref <tag>), not on ${GITHUB_REF}"; exit 1 ;;
          esac

  cli:
    name: antibody CLI (${{ matrix.target }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: "" }
          - { os: macos-15, target: aarch64-apple-darwin, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        run: cargo build --release --locked -p antibody-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          cp "target/${{ matrix.target }}/release/antibody${{ matrix.exe }}" "dist/antibody-${{ matrix.target }}${{ matrix.exe }}"
          cd dist
          # Only the binary: a glob would also list the .sha256 file the redirect has just created (empty),
          # and `shasum -c` would then fail on that line (v0.5.0's macOS file, fixed by hand).
          B="antibody-${{ matrix.target }}${{ matrix.exe }}"
          if command -v sha256sum >/dev/null; then sha256sum "$B"; else shasum -a 256 "$B"; fi | sed 's# \*#  #' > "antibody-${{ matrix.target }}.sha256"
          cat ./*.sha256
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/antibody-${{ matrix.target }}${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: antibody-${{ matrix.target }}
          path: dist/

  verifier:
    name: the verifier OutLayer runs (wasm32-wasip2)
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        run: |
          set -euo pipefail
          rustc --version
          bash scripts/build/verifier-wasm.sh
          mkdir dist
          cp target/reproducible/wasm32-wasip2/release/antibody-verify.wasm dist/
          (cd dist && sha256sum antibody-verify.wasm | tee antibody-verify.wasm.sha256)
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/antibody-verify.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: antibody-verify
          path: dist/

  image:
    name: CLI image (ghcr.io)
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ env.TAG }}
      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  draft:
    name: draft release
    needs: [cli, verifier, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the binaries and the verifier: a Docker build's record is an artifact of the run too.
          pattern: antibody-*
          path: dist
          merge-multiple: true
      - run: ls -l dist && cat dist/*.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: dist/*
          body: |
            Prebuilt `antibody` CLI binaries (Linux x86_64, macOS arm64, Windows x86_64), the verifier build
            OutLayer runs (`antibody-verify.wasm`; compare its sha256 with the pinned `wasm_hash` in
            `antibody judge`), and the CLI image `ghcr.io/himess/antibody:${{ env.TAG }}`. Each file has a
            sha256 and a build provenance attestation (`gh attestation verify <file> -R Himess/antibody`).

            Try the practice program (a tutorial) with no account, no key and no build:
            `antibody try --name <you>`. Check the deployment with view calls only: `antibody judge`.
