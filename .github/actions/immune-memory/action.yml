name: Antibody immune memory
description: >-
  Re-runs the paid proofs of an Antibody program that this run can read against the pull request's compiled
  code, with the verifier, locally, at the program's anchor; fails when one still breaks a committed rule.
  Use it on the pull_request event, never pull_request_target (README.md).
author: Antibody

inputs:
  version:
    description: The antibody release whose prebuilt binary runs (its sha256 is checked against the release's .sha256 file)
    required: false
    default: v0.6.0
  repository:
    description: The repository that publishes the release
    required: false
    default: Himess/antibody
  program:
    description: The program's id on near-antibody (default the mapping's `program`)
    required: false
    default: ""
  config:
    description: >-
      The mapping file the project commits, relative to working-directory. The rest of .antibody/ is the CLI's
      private state: commit only what README.md's .gitignore rules let through
    required: false
    default: .antibody/immune.toml
  project-key:
    description: >-
      Optional. The project's key (its key file's JSON, or the secret in hex) as a repository secret: it reads paid
      findings wrapped to the project. GitHub never gives secrets to pull requests from forks, which re-run disclosed
      proofs only. Any code the job runs can reach it, forge build included (README.md, Security)
    required: false
    default: ""
  build:
    description: >-
      "false": skip installing Foundry and forge build, for a job that takes the artifacts from a job that built
      them with no secret (README.md, Two jobs)
    required: false
    default: "true"
  network:
    description: NEAR network (the binary has the testnet deployment built in)
    required: false
    default: testnet
  working-directory:
    description: The Foundry project (forge build runs here; the mapping's paths start here)
    required: false
    default: .
  foundry-version:
    description: The Foundry release that builds the contracts
    required: false
    default: v1.8.5
  strict:
    description: "true: a paid proof that cannot be read here counts as inconclusive"
    required: false
    default: "false"
  fail-on-inconclusive:
    description: "true: fail when no proof breaks a rule but the result is inconclusive (never shown as fixed)"
    required: false
    default: "true"
  manifest-out:
    description: >-
      Optional. Also write the pull request's code as the program's next round manifest, at this path (relative to
      working-directory), for the immune-enclave action's job to propose (README.md, Two halves)
    required: false
    default: ""
  api:
    description: Optional. An Antibody API that indexed the reveals, for blobs not committed under the mapping's `blobs`
    required: false
    default: ""

outputs:
  exit-code:
    description: "0: no re-run paid proof breaks a rule; 2: one still breaks a rule; 3: inconclusive; 1: the check could not run"
    value: ${{ steps.immune.outputs.exit-code }}
  report:
    description: The JSON report's path (empty when no report was written)
    value: ${{ steps.immune.outputs.report }}
  manifest:
    description: The round manifest's path, when manifest-out was given and the check could write it
    value: ${{ steps.immune.outputs.manifest }}

runs:
  using: composite
  steps:
    - name: antibody ${{ inputs.version }} (checksum-verified release binary)
      id: bin
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        # Hashed from stdin, so no file name is printed: GNU sha256sum escapes a name holding a backslash (as
        # RUNNER_TEMP does on Windows), and its line then starts with `\`.
        sha256_of() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi < "$1" | cut -d' ' -f1; }
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=x86_64-unknown-linux-gnu; exe="" ;;
          macOS-ARM64) target=aarch64-apple-darwin; exe="" ;;
          Windows-X64) target=x86_64-pc-windows-msvc; exe=".exe" ;;
          *) echo "::error::no prebuilt antibody binary for ${RUNNER_OS} ${RUNNER_ARCH}"; exit 1 ;;
        esac
        dir="${RUNNER_TEMP}/antibody-${VERSION}"
        mkdir -p "$dir"
        base="https://github.com/${REPO}/releases/download/${VERSION}"
        curl -fsSL --retry 3 -o "$dir/antibody${exe}" "$base/antibody-${target}${exe}"
        curl -fsSL --retry 3 -o "$dir/antibody.sha256" "$base/antibody-${target}.sha256"
        want=$(awk -v f="antibody-${target}${exe}" '$2 == f || $2 == "*" f {print $1}' "$dir/antibody.sha256")
        got=$(sha256_of "$dir/antibody${exe}")
        if [ -z "$want" ] || [ "$want" != "$got" ]; then
          echo "::error::antibody-${target}${exe} does not match the release's sha256 (want '${want}', got ${got})"
          exit 1
        fi
        chmod +x "$dir/antibody${exe}"
        echo "antibody-${target}${exe} ${got} (checked against ${base}/antibody-${target}.sha256)"
        echo "path=$dir/antibody${exe}" >> "$GITHUB_OUTPUT"
        echo "sha256=$got" >> "$GITHUB_OUTPUT"

    - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      if: inputs.build != 'false'
      with:
        version: ${{ inputs.foundry-version }}

    # The pull request's own code is built here, and its code runs here: forge build follows its foundry.toml.
    # Whatever runs in this job can reach a secret given to the job (README.md, Security). With `build: false`,
    # the artifacts come from a job that built them with no secret.
    - name: forge build
      if: inputs.build != 'false'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: forge build

    - name: antibody immune
      id: immune
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANTIBODY: ${{ steps.bin.outputs.path }}
        ANTIBODY_SHA256: ${{ steps.bin.outputs.sha256 }}
        ANTIBODY_PROJECT_KEY: ${{ inputs.project-key }}
        PROGRAM: ${{ inputs.program }}
        CONFIG: ${{ inputs.config }}
        NETWORK: ${{ inputs.network }}
        STRICT: ${{ inputs.strict }}
        API: ${{ inputs.api }}
        MANIFEST_OUT: ${{ inputs.manifest-out }}
      run: |
        set -uo pipefail
        # GitHub runs this step as `bash -eo pipefail`: errexit stays on. The binary's exit code is its verdict, so
        # it is captured with `||` and the outputs, the job summary and the verdict step always follow it.
        sha256_of() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi < "$1" | cut -d' ' -f1; }
        json="$RUNNER_TEMP/immune.json"
        md="$RUNNER_TEMP/immune.md"
        rm -f "$json" "$md"
        code=0
        # The first step checked the binary, and the code this job ran since (forge build) could have replaced it:
        # it is checked again just before it runs with the key. That catches a replaced binary, not a runner the
        # build took over (README.md, Security).
        if [ -z "$ANTIBODY_SHA256" ] || [ "$(sha256_of "$ANTIBODY")" != "$ANTIBODY_SHA256" ]; then
          echo "::error title=Antibody immune memory::the antibody binary no longer matches the sha256 checked in the first step; it was not run"
          code=1
        else
          args=(--network "$NETWORK" immune --config "$CONFIG" --json "$json" --md "$md")
          [ -n "$PROGRAM" ] && args+=(--program "$PROGRAM")
          [ "$STRICT" = "true" ] && args+=(--strict)
          [ -n "$API" ] && args+=(--api "$API")
          [ -n "$MANIFEST_OUT" ] && args+=(--manifest-out "$MANIFEST_OUT")
          "$ANTIBODY" "${args[@]}" || code=$?
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -n "$MANIFEST_OUT" ] && [ -f "$MANIFEST_OUT" ]; then
          echo "manifest=$MANIFEST_OUT" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$json" ]; then
          echo "report=$json" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$md" ]; then
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### Antibody immune memory: the check could not run (exit $code); its log says why" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0

    - name: verdict
      shell: bash
      env:
        CODE: ${{ steps.immune.outputs.exit-code }}
        FAIL_ON_INCONCLUSIVE: ${{ inputs.fail-on-inconclusive }}
      run: |
        case "$CODE" in
          0) echo "No paid proof re-run here breaks a rule." ;;
          2) echo "::error title=Antibody immune memory::a paid proof still breaks a committed rule against this pull request's code (job summary)"; exit 1 ;;
          3) if [ "$FAIL_ON_INCONCLUSIVE" = "true" ]; then
               echo "::error title=Antibody immune memory::no paid proof breaks a rule, but the result is inconclusive (job summary)"; exit 1
             fi
             echo "::warning title=Antibody immune memory::no paid proof breaks a rule, but the result is inconclusive (job summary)" ;;
          *) echo "::error title=Antibody immune memory::the check could not run (exit ${CODE:-none})"; exit 1 ;;
        esac
