[package]
name = "antibody-near-fixture-status-message"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Verifier v2's NEAR fixture: a near-sdk-rs status-message contract with a counter and a payable method, run end to end by crates/verifier-near/tests/near_sdk.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.9.0" }

[profile.release]
strip = true
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
resolver = "3"
